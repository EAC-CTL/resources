<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Eastern Arizona College Fix Your Content Day countdown to November 10, 2026, at midnight Arizona time.">
  <title>EAC Fix Your Content Day — November 10, 2026</title>
  <link rel="preload" href="assets/fonts/Bungee-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/widget.css">
  <script src="assets/countdown.js" defer></script>
</head>
<body>
  <main class="widget" aria-labelledby="event-title">
    <header class="artwork-header">
      <!-- The original supplied artwork is unchanged. CSS shows its header only;
           the static example countdown never appears in this image window. -->
      <img class="header-image" src="assets/eac-fycd-artwork.png" width="1774" height="887" alt="" fetchpriority="high">
      <h1 id="event-title" class="sr-only">Eastern Arizona College — Fix Your Content Day</h1>
      <p class="sr-only">November 10, 2026. EAC vs. the World.</p>
    </header>

    <p class="mobile-date" aria-hidden="true">
      <strong>November 10, 2026</strong><span>EAC vs. the World</span>
    </p>

    <section class="countdown-panel" aria-labelledby="countdown-heading">
      <div class="heading-row">
        <h2 id="countdown-heading">Countdown to Game Day</h2>
      </div>
      <div id="countdown" class="countdown" role="timer" aria-live="off"
           aria-label="Countdown to November 10, 2026, at midnight Arizona time."
           aria-describedby="countdown-help">
        <div class="count-card"><div class="card-face">
          <span class="number" id="days">—</span><span class="unit">Days</span>
        </div></div>
        <div class="count-card"><div class="card-face">
          <span class="number" id="hours">—</span><span class="unit">Hours</span>
        </div></div>
        <div class="count-card"><div class="card-face">
          <span class="number" id="minutes">—</span><span class="unit">Minutes</span>
        </div></div>
        <div class="count-card"><div class="card-face">
          <span class="number" id="seconds">—</span><span class="unit">Seconds</span>
        </div></div>
      </div>
      <p id="event-status" class="sr-only" role="status" aria-atomic="true"></p>
      <p id="countdown-help" class="sr-only">The display updates every second. The countdown ends November 10, 2026, at midnight Arizona time, UTC minus 7.</p>
    </section>

    <noscript><p class="no-script">Fix Your Content Day starts November 10, 2026, at 12:00 a.m. Arizona time (UTC−7). Enable JavaScript for the live countdown.</p></noscript>
  </main>
</body>
</html>
